packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 配置项放在 workspace manifest 中（camelCase）
verifyDepsBeforeRun: false
linkWorkspacePackages: true
preferWorkspacePackages: true
sharedWorkspaceLockfile: true
autoInstallPeers: true

allowBuilds:
  esbuild: false
  protobufjs: true
  vue-demi: false

# patch 的键带精确版本，所以被 patch 的包在 package.json 里也必须**精确 pin**，
# 不能写 range。踩过的坑：`@univerjs/*` 原先写 `^0.25.1`，而对 0.x 来说
# `^0.25.1` = `>=0.25.1 <0.26.0`，覆盖得到 0.25.2 —— 于是任何不限包名的依赖解析
# （裸 `pnpm update -r`，或删掉 lockfile 重装）都会把 univer 抬到 0.25.2，键随即失配，
# pnpm 以 ERR_PNPM_UNUSED_PATCH 中止。故 12 个 `@univerjs/*` 全部精确 pin 0.25.1。
# 要升 univer，先用 `pnpm patch @univerjs/<pkg>@<新版本>` 重做 patch，再同步改这里的键
# 与 patches/ 下的文件名。exceljs 4.4.0 同理（目前它就是最新，patch 稳定）。
patchedDependencies:
  "@univerjs/engine-render@0.25.1": patches/@univerjs__engine-render@0.25.1.patch
  exceljs@4.4.0: patches/exceljs@4.4.0.patch
