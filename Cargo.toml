# GreyWork Rust workspace。
#
# 存在意义：桌面壳（`apps/desktop/src-tauri`）与 headless 服务端（`apps/server`，见
# docs/architecture.md）共用同一份领域逻辑。领域逻辑收在 `crates/greywork-host`，
# 两侧只做薄包装 —— 避免命令面出现两份会漂移的实现。
#
# 单一 `Cargo.lock` 在仓库根：CI 与 husky 的 `--locked` 都指向它，所以那两处的
# cargo 调用必须从仓库根发起（用 `-p` 选包），不能再 `cd apps/desktop/src-tauri`。
[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/server",
  "crates/greywork-host",
]

# 依赖的调试信息是 target/debug 体积与重编时间的大头：本机同一棵依赖树，release（debug=0）
# 的 target 是 3.6GB，dev（默认 debug=2）是 66GB。依赖里的变量几乎不会用调试器去看，
# 但**回溯还需要文件和行号**，所以降到 1（limited，保留行表）而不是 0。
# 自己的 crate 不受影响（这里只匹配依赖），本地开发照旧能单步。
#
# 放在 workspace 根：cargo 只认根 manifest 的 profile，成员里的会被忽略（并告警）。
[profile.dev.package."*"]
debug = 1

# ⚠️ 上面那 66GB 里，**最大的一块不是调试信息，是增量编译目录**（2026-09-29 实测
# target/debug/incremental 占 33G / 512 个目录，deps 29G）。`debug = 1` 一点没碰到它：
# cargo 从不回收旧的增量会话目录，每换一个编译单元图就新建一个。
#
# 下面 `incremental = false` 把那 33G 归零。代价是实打实的：greywork_host 有 3.4 万行，
# 增量关掉后每次改 Rust 都要全量重编这个 crate。想换回增量就把这行注释掉，改用
# `node scripts/disks-reclaim.mjs cargo --apply` 定期剪枝。
#
# 为什么会攒这么猛：.husky/pre-push 每次推送（只要动了 Rust）都跑一遍
# `cargo clippy --all-targets` + `cargo test`，而 clippy / test / build 三者的指纹互不相同，
# 各自维护一整套增量目录。实测 9-24 一天就生成了 284 个。
[profile.dev]
incremental = false

# 发布构建：LTO + opt-level 3 + abort + strip，换更小更快的产物。只在 release 生效，
# dev / 测试不受影响。`panic = "abort"` 关掉 unwind —— 本仓没有任何 `catch_unwind`
# 依赖它，所以安全。
[profile.release]
lto = true
opt-level = 3
panic = "abort"
strip = true
