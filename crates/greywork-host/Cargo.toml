[package]
name = "greywork-host"
version = "0.3.0"
description = "GreyWork host domain logic shared by the desktop shell and the headless server"
authors = ["GreyWork Team"]
edition = "2021"

# 本 crate 刻意**不依赖 tauri**：它是桌面壳与 headless 服务端共用的领域逻辑层。
# 任何需要「宿主出口」的东西（事件广播、系统通知、路径来源）走 `host::HostContext`，
# 由两侧各自实现（桌面 = AppHandle，服务端 = WebSocket 广播）。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# MCP 探活（stdio 子进程 + Streamable HTTP）与 ACP 进程托管都基于它。
agent-client-protocol = "2.0.0"
futures-util = "0.3"
# 插件市场包与 registry 签名的 SHA-256 校验。
sha2 = "0.10"
# 官方市场 registry 的 ed25519 签名验签（公钥硬编码，私钥离线）。
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
# 宿主数据库（设置 / 自动化 / 编排存档 / ACP 后端目录）。
# bundled：自带 SQLite 源码编译，不依赖系统 libsqlite3。
rusqlite = { version = "0.32", features = ["bundled"] }
# LLM 流式响应按字节块处理。
bytes = "1"

# 文本文件读取要按编码解码 —— Windows 记事本默认存 GBK/GB18030（简中「ANSI」）或
# UTF-16，strict UTF-8 读会报错或读出乱码。encoding_rs 负责 BOM 嗅探与解码，
# chardetng 负责无 BOM 时的编码检测（两者均来自 Firefox 的编码栈）。
encoding_rs = "0.8"
chardetng = "1"

# 老格式 .xls（OLE2/BIFF）在渲染端没有可用的解析器：exceljs 只认 xlsx，Univer 也走 exceljs。
# JS 侧唯一能读 xls 的 SheetJS 已从 npm 下架（npm 上停在 0.18.5，带两个未修复 CVE），
# 故改由宿主解析 —— calamine 是纯 Rust，同时覆盖 xls/xlsx/xlsb/ods，且能按内容嗅探
# 而不只看扩展名（.xlt 与「名为 .xls 实为 xlsx」都能正确读）。
# 不开 `chrono` feature：日期展示走 ExcelDateTime::to_ymd_hms_milli（非 feature 门控），
# 少一个 feature 就少一处版本/特性统一面的意外。
calamine = "0.36"

# 企业微信 / QQ 扫码创建：AstrBot 逆向出的 q.qq.com 绑定流程把 AppSecret 以 AES-256-GCM
# 密文下发（12B nonce + 密文 + 16B tag），绑定用的对称密钥由本机生成并只留在宿主内存。
aes-gcm = "0.10"
# 企业微信入站长连接的媒体是 AES-256-CBC 密文（IV 取密钥前 16 字节、PKCS#7 填充）：
# 只要块解密 + 手工 CBC 链接，不引 cbc crate。aes 已是 aes-gcm 的传递依赖。
aes = "0.8"
getrandom = "0.3"
form_urlencoded = "1"
# QQ / Discord / 钉钉 / 飞书 / 企业微信的网关长连接都走它。
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
# QQ 富媒体文件上传的「申请上传」步骤要求带上文件 md5 / sha1（分片合并时的校验依据）。
md-5 = "0.10"
sha1 = "0.10"
# 微信通道（腾讯 iLink Bot API）的协议整条交给官方 Rust SDK：扫码登录（含配对码 / IDC
# 重定向 / 已绑定复用）、长轮询收信、文本与媒体收发、CDN 上传下载、AES-128-ECB 加解密
# 都在它里面。宿主只保留 SDK 管不到的那层：状态机、凭证落盘（0600）、入站媒体落地、
# 事件与命令、发送者策略（见 src/wechat.rs）。
wechatbot = "0.4"

# Unix 上按进程组回收子进程树要 killpg(2)（见 process_guard::kill_process_tree）。
# Windows 走 taskkill，用不到，故限定平台。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
