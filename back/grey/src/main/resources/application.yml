spring:
  application:
    name: grey
  # 本地开发由 spring-boot-docker-compose 自动注入连接信息（compose.yaml）
  # 独立部署时用环境变量覆盖：SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
  datasource:
    hikari:
      maximum-pool-size: 10
      pool-name: grey-pool
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deletedAt
      logic-delete-value: "NOW(3)"
      logic-not-delete-value: "NULL"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

grey:
  auth:
    # 留空则首次启动随机生成并打到日志；设置后每次启动都与该值对齐（方便自托管）
    enroll-code: ${GREY_ENROLL_CODE:}
    session-ttl: PT720H
  oidc:
    # 登录成功后跳回客户端的前缀白名单，避免 ticket 被带去外站
    allowed-redirects: ${GREY_OIDC_REDIRECTS:http://127.0.0.1,http://localhost,greywork://}
    # 身份源配置示例（provider 名字任意，未填 client-id 视为未启用）：
    # providers:
    #   github:
    #     client-id: xxx
    #     client-secret: xxx
    #     authorization-url: https://github.com/login/oauth/authorize
    #     token-url: https://github.com/login/oauth/access_token
    #     userinfo-url: https://api.github.com/user
    #     scopes: [read:user, user:email]
    #     email-field: email
    #     link-by-email: true
    #   google:
    #     client-id: xxx
    #     client-secret: xxx
    #     authorization-url: https://accounts.google.com/o/oauth2/v2/auth
    #     token-url: https://oauth2.googleapis.com/token
    #     userinfo-url: https://openidconnect.googleapis.com/v1/userinfo
  llm:
    # 32 字节 base64，生成：openssl rand -base64 32
    master-key: ${GREY_MASTER_KEY:}
    rpm-limit: ${GREY_LLM_RPM:60}
    # 0 表示不限额
    daily-token-limit: ${GREY_LLM_DAILY_TOKENS:0}
  ai:
    # 服务端 AI 调用未指定模型时的默认值；留空则按供应商取内置默认
    default-model: ${GREY_AI_DEFAULT_MODEL:}
    max-tokens: ${GREY_AI_MAX_TOKENS:2048}
    temperature: ${GREY_AI_TEMPERATURE:0.2}
  automation:
    # 调度扫描间隔（毫秒）
    tick-ms: ${GREY_AUTOMATION_TICK_MS:30000}
    # 宿主认领后的租约：超时未回执则重新入队（防宿主崩溃把任务钉死）
    claim-lease: ${GREY_AUTOMATION_CLAIM_LEASE:PT30M}
    # 云端（服务端 AI）并发上限
    cloud-concurrency: ${GREY_AUTOMATION_CLOUD_CONCURRENCY:4}
    # 已完成队列/运行记录的保留天数
    retention-days: ${GREY_AUTOMATION_RETENTION_DAYS:30}
    # cron 使用的时区；留空 = 服务器默认时区
    zone: ${GREY_AUTOMATION_ZONE:}
  storage:
    # 对象存储（RustFS / 任意 S3 兼容服务）；未启用时上传接口返回 storage_disabled
    enabled: ${GREY_S3_ENABLED:false}
    endpoint: ${GREY_S3_ENDPOINT:http://127.0.0.1:9000}
    region: ${GREY_S3_REGION:us-east-1}
    access-key: ${GREY_S3_ACCESS_KEY:}
    secret-key: ${GREY_S3_SECRET_KEY:}
    bucket: ${GREY_S3_BUCKET:greywork}
    # RustFS 默认按路径寻址：http://host:9000/bucket/key
    path-style: ${GREY_S3_PATH_STYLE:true}
    # 预签名上传/下载链接有效期
    presign-ttl: ${GREY_S3_PRESIGN_TTL:PT15M}
    # 单对象上限（默认 500 MiB）
    max-object-bytes: ${GREY_S3_MAX_OBJECT_BYTES:524288000}
    # 配置后 public 对象直接走该前缀（CDN / 反向代理）
    public-base-url: ${GREY_S3_PUBLIC_BASE_URL:}
    # 未完成上传的清理时限
    pending-ttl: ${GREY_S3_PENDING_TTL:PT24H}
  web:
    allowed-origins: ${GREY_ALLOWED_ORIGINS:http://localhost:5173}
    # 生成 webhook 回调地址时用的对外基地址
    public-base-url: ${GREY_PUBLIC_BASE_URL:http://localhost:8080}
