<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreyWork 运维台</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #161b22;
        --line: #283039;
        --text: #e6edf3;
        --dim: #8b949e;
        --accent: #58a6ff;
        --danger: #f85149;
        --ok: #3fb950;
        --warn: #d29922;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      header .who {
        color: var(--dim);
        font-size: 12px;
      }
      header .spacer {
        flex: 1;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      input,
      select {
        height: 30px;
        padding: 0 8px;
        background: #0d1117;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }
      input:focus,
      select:focus {
        outline: 1px solid var(--accent);
        border-color: var(--accent);
      }
      button {
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #21262d;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: #3d444d;
        background: #262d36;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #06121f;
        font-weight: 600;
      }
      button.danger {
        color: var(--danger);
        border-color: #4a2226;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 12.5px;
      }
      th {
        color: var(--dim);
        font-weight: 500;
      }
      td.mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .badge {
        display: inline-block;
        padding: 0 7px;
        border-radius: 999px;
        font-size: 11px;
        line-height: 18px;
        border: 1px solid var(--line);
      }
      .badge.ok {
        color: var(--ok);
        border-color: #1f4429;
      }
      .badge.warn {
        color: var(--warn);
        border-color: #4a3a12;
      }
      .badge.off {
        color: var(--dim);
      }
      .badge.danger {
        color: var(--danger);
        border-color: #4a2226;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
      }
      .tabs button {
        border-radius: 6px 6px 0 0;
        border-bottom-color: transparent;
      }
      .tabs button[aria-selected="true"] {
        background: var(--panel);
        border-color: var(--line);
        border-bottom-color: var(--panel);
      }
      .hint {
        color: var(--dim);
        font-size: 12px;
      }
      .notice {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        display: none;
      }
      .notice.show {
        display: block;
      }
      .notice.err {
        background: #2d1416;
        color: #ffb4ad;
        border: 1px solid #4a2226;
      }
      .notice.ok {
        background: #10251a;
        color: #b6f0c8;
        border: 1px solid #1f4429;
      }
      .issued {
        margin-top: 12px;
        padding: 12px;
        border: 1px dashed #3d444d;
        border-radius: 8px;
        display: none;
      }
      .issued.show {
        display: block;
      }
      .issued code {
        font-size: 16px;
        letter-spacing: 0.12em;
        color: var(--accent);
      }
      .hidden {
        display: none !important;
      }
      .empty {
        padding: 24px;
        text-align: center;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GreyWork 运维台</h1>
      <span class="who" id="who"></span>
      <span class="spacer"></span>
      <button id="logout" class="hidden">退出</button>
    </header>
    <main>
      <!-- 登录：直接走入场码接口，拿到 token 与角色后进后台 -->
      <section id="login" class="card" style="max-width: 420px; margin: 48px auto">
        <h2 style="margin: 0 0 4px; font-size: 14px">用入场码登录</h2>
        <p class="hint" style="margin: 0 0 16px">只有 <code>role=admin</code> 的账号能进来看数据。</p>
        <div class="row" style="flex-direction: column; align-items: stretch">
          <input id="login-code" placeholder="入场码" autocomplete="off" />
          <input id="login-email" placeholder="管理员邮箱" autocomplete="username" />
          <button class="primary" id="login-go">登录</button>
        </div>
        <div class="notice err" id="login-error"></div>
      </section>

      <section id="console" class="hidden">
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-users" aria-selected="true">用户</button>
          <button role="tab" id="tab-codes" aria-selected="false">入场码</button>
        </div>

        <!-- 用户 -->
        <div id="pane-users" class="card">
          <div class="row">
            <input id="user-query" placeholder="按邮箱或昵称搜索" style="width: 260px" />
            <button id="user-refresh">刷新</button>
            <span class="hint" id="user-count"></span>
          </div>
          <table>
            <thead>
              <tr>
                <th>邮箱</th>
                <th>昵称</th>
                <th>角色</th>
                <th>状态</th>
                <th>注册时间</th>
                <th style="width: 180px">操作</th>
              </tr>
            </thead>
            <tbody id="user-rows"></tbody>
          </table>
          <div class="empty hidden" id="user-empty">没有匹配的用户</div>
        </div>

        <!-- 入场码 -->
        <div id="pane-codes" class="card hidden">
          <div class="row">
            <select id="code-hours">
              <option value="1">1 小时</option>
              <option value="24" selected>24 小时</option>
              <option value="168">7 天</option>
            </select>
            <button class="primary" id="code-issue">签发新入场码</button>
            <button id="code-refresh">刷新</button>
            <span class="hint">明文只显示这一次，库里存的是 sha256。</span>
          </div>
          <div class="issued" id="code-issued">
            <div class="hint">新入场码（请立即复制）</div>
            <div class="row" style="margin-top: 6px">
              <code id="code-value"></code>
              <button id="code-copy">复制</button>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>哈希前缀</th>
                <th>状态</th>
                <th>过期</th>
                <th>使用时间</th>
                <th>签发时间</th>
                <th style="width: 90px">操作</th>
              </tr>
            </thead>
            <tbody id="code-rows"></tbody>
          </table>
          <div class="empty hidden" id="code-empty">还没有入场码</div>
        </div>

        <div class="notice" id="notice"></div>
      </section>
    </main>
    <script>
      (() => {
        const TOKEN_KEY = "greywork.admin.token";
        const state = { token: sessionStorage.getItem(TOKEN_KEY) || "", user: null, tab: "users" };

        const $ = (id) => document.getElementById(id);
        const fmt = (value) => (value ? new Date(value).toLocaleString() : "—");

        function showNotice(kind, text) {
          const node = $("notice");
          node.className = "notice show " + kind;
          node.textContent = text;
        }

        function clearNotice() {
          $("notice").className = "notice";
        }

        /** 统一请求：带 token，401 直接回登录页；错误抛出 {code,message}。 */
        async function api(path, options = {}) {
          const response = await fetch(path, {
            method: options.method || "GET",
            headers: {
              ...(state.token ? { Authorization: "Bearer " + state.token } : {}),
              ...(options.body ? { "Content-Type": "application/json" } : {}),
            },
            body: options.body ? JSON.stringify(options.body) : undefined,
          });
          if (response.status === 401) {
            signOut("登录态已失效，请重新登录");
            throw new Error("unauthorized");
          }
          if (response.status === 204) return null;
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            const error = new Error(payload.message || response.statusText);
            error.code = payload.code;
            throw error;
          }
          return payload;
        }

        function signOut(reason) {
          state.token = "";
          state.user = null;
          sessionStorage.removeItem(TOKEN_KEY);
          $("console").classList.add("hidden");
          $("logout").classList.add("hidden");
          $("login").classList.remove("hidden");
          $("who").textContent = "";
          if (reason) {
            $("login-error").textContent = reason;
            $("login-error").classList.add("show");
          }
        }

        function enterConsole(user) {
          state.user = user;
          $("login").classList.add("hidden");
          $("console").classList.remove("hidden");
          $("logout").classList.remove("hidden");
          $("who").textContent = user.email + " · " + user.role;
          void loadUsers();
          void loadCodes();
        }

        /* ---------- 登录 ---------- */
        $("login-go").addEventListener("click", async () => {
          const code = $("login-code").value.trim();
          const email = $("login-email").value.trim();
          const error = $("login-error");
          error.classList.remove("show");
          if (!code || !email) {
            error.textContent = "请填写入场码与邮箱";
            error.classList.add("show");
            return;
          }
          $("login-go").disabled = true;
          try {
            const session = await api("/api/auth/enroll", {
              method: "POST",
              body: { code, email, deviceName: "admin-web", platform: "web" },
            });
            if (session.user.role !== "admin") {
              error.textContent = "该账号不是管理员（GREY_ADMIN_EMAILS 里没有它）";
              error.classList.add("show");
              return;
            }
            state.token = session.token;
            sessionStorage.setItem(TOKEN_KEY, session.token);
            enterConsole(session.user);
          } catch (failure) {
            error.textContent = failure.message === "unauthorized" ? "登录失败" : failure.message;
            error.classList.add("show");
          } finally {
            $("login-go").disabled = false;
          }
        });

        $("logout").addEventListener("click", async () => {
          try {
            await api("/api/auth/logout", { method: "POST" });
          } catch {
            /* 忽略 */
          }
          signOut();
        });

        /* ---------- 用户 ---------- */
        function cell(text, className) {
          const td = document.createElement("td");
          td.textContent = text;
          if (className) td.className = className;
          return td;
        }

        function badge(text, tone) {
          const node = document.createElement("span");
          node.className = "badge " + tone;
          node.textContent = text;
          return node;
        }

        async function loadUsers() {
          clearNotice();
          const query = $("user-query").value.trim();
          try {
            const users = await api("/api/admin/users?limit=100" + (query ? "&query=" + encodeURIComponent(query) : ""));
            const rows = $("user-rows");
            rows.replaceChildren();
            for (const user of users) {
              const tr = document.createElement("tr");
              tr.append(
                cell(user.email),
                cell(user.displayName || "—"),
                cell(user.role === "admin" ? "管理员" : "普通"),
                cell(user.status === "active" ? "正常" : "已禁用", "mono"),
                cell(fmt(user.createdAt), "mono"),
              );

              const actions = document.createElement("td");
              const toggle = document.createElement("button");
              const isActive = user.status === "active";
              toggle.textContent = isActive ? "禁用" : "启用";
              if (isActive) toggle.className = "danger";
              toggle.addEventListener("click", async () => {
                toggle.disabled = true;
                try {
                  await api("/api/admin/users/" + user.id, {
                    method: "PATCH",
                    body: { status: isActive ? "disabled" : "active" },
                  });
                  showNotice("ok", (isActive ? "已禁用 " : "已启用 ") + user.email);
                  await loadUsers();
                } catch (failure) {
                  showNotice("err", failure.message);
                  toggle.disabled = false;
                }
              });

              const kick = document.createElement("button");
              kick.textContent = "踢下线";
              kick.style.marginLeft = "6px";
              kick.addEventListener("click", async () => {
                kick.disabled = true;
                try {
                  const report = await api("/api/admin/users/" + user.id + "/sessions", { method: "DELETE" });
                  showNotice("ok", "已清掉 " + report.devices + " 台设备的会话");
                } catch (failure) {
                  showNotice("err", failure.message);
                  kick.disabled = false;
                }
              });

              actions.append(toggle, kick);
              tr.append(actions);
              rows.append(tr);
            }
            $("user-count").textContent = users.length + " 个账号";
            $("user-empty").classList.toggle("hidden", users.length > 0);
          } catch (failure) {
            if (failure.message !== "unauthorized") showNotice("err", failure.message);
          }
        }

        let queryTimer;
        $("user-query").addEventListener("input", () => {
          clearTimeout(queryTimer);
          queryTimer = setTimeout(loadUsers, 250);
        });
        $("user-refresh").addEventListener("click", loadUsers);

        /* ---------- 入场码 ---------- */
        const CODE_STATUS = { active: ["可用", "ok"], used: ["已使用", "off"], expired: ["已过期", "warn"] };

        async function loadCodes() {
          try {
            const codes = await api("/api/admin/enroll-codes");
            const rows = $("code-rows");
            rows.replaceChildren();
            for (const code of codes) {
              const tr = document.createElement("tr");
              const [label, tone] = CODE_STATUS[code.status] || [code.status, "off"];
              const statusCell = document.createElement("td");
              statusCell.append(badge(label, tone));
              tr.append(
                cell(code.hashPrefix + "…", "mono"),
                statusCell,
                cell(fmt(code.expiresAt), "mono"),
                cell(fmt(code.usedAt), "mono"),
                cell(fmt(code.createdAt), "mono"),
              );

              const actions = document.createElement("td");
              if (code.status === "active") {
                const revoke = document.createElement("button");
                revoke.textContent = "撤销";
                revoke.className = "danger";
                revoke.addEventListener("click", async () => {
                  revoke.disabled = true;
                  try {
                    await api("/api/admin/enroll-codes/" + code.id, { method: "DELETE" });
                    showNotice("ok", "已撤销该入场码");
                    await loadCodes();
                  } catch (failure) {
                    showNotice("err", failure.message);
                    revoke.disabled = false;
                  }
                });
                actions.append(revoke);
              }
              tr.append(actions);
              rows.append(tr);
            }
            $("code-empty").classList.toggle("hidden", codes.length > 0);
          } catch (failure) {
            if (failure.message !== "unauthorized") showNotice("err", failure.message);
          }
        }

        $("code-issue").addEventListener("click", async () => {
          try {
            const issued = await api("/api/admin/enroll-codes", {
              method: "POST",
              body: { expiresInHours: Number($("code-hours").value) },
            });
            $("code-value").textContent = issued.code;
            $("code-issued").classList.add("show");
            showNotice("ok", "已签发，过期时间 " + fmt(issued.item.expiresAt));
            await loadCodes();
          } catch (failure) {
            showNotice("err", failure.message);
          }
        });

        $("code-copy").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText($("code-value").textContent);
            showNotice("ok", "已复制");
          } catch {
            showNotice("err", "复制失败，请手动选择");
          }
        });

        $("code-refresh").addEventListener("click", loadCodes);

        /* ---------- 页签 ---------- */
        function selectTab(tab) {
          state.tab = tab;
          $("tab-users").setAttribute("aria-selected", String(tab === "users"));
          $("tab-codes").setAttribute("aria-selected", String(tab === "codes"));
          $("pane-users").classList.toggle("hidden", tab !== "users");
          $("pane-codes").classList.toggle("hidden", tab !== "codes");
          clearNotice();
        }
        $("tab-users").addEventListener("click", () => selectTab("users"));
        $("tab-codes").addEventListener("click", () => selectTab("codes"));

        /* ---------- 启动：有 token 就先认人 ---------- */
        (async () => {
          if (!state.token) return;
          try {
            const me = await api("/api/auth/me");
            if (me.user.role === "admin") enterConsole(me.user);
            else signOut("该账号不是管理员");
          } catch {
            signOut();
          }
        })();
      })();
    </script>
  </body>
</html>
