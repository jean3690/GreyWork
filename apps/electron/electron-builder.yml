# GreyWork Electron 壳的打包配置（@see https://www.electron.build/configuration）
#
# 路径一律相对**本文件所在目录**（apps/electron），故渲染层/sidecar 都要往上跳。
#
# 构建前置（顺序不能反）：
#   1. cargo build --release -p greywork-server     # sidecar 二进制
#   2. pnpm --filter @greywork/desktop build        # 渲染层 SPA（apps/desktop/dist）
#   3. pnpm --filter @greywork/electron build       # 主进程 / preload（apps/electron/out）
#   4. electron-builder
# 根脚本 `pnpm electron:package` 把四步串起来。
appId: com.greywork.desktop
productName: GreyWork
# 显式指定可执行名：默认会从包名 `@greywork/electron` 推出 `@greyworkelectron` 这种垃圾名，
# 用户真要去命令行起的就是它。也用于 AppImage 的 .desktop Exec。
executableName: GreyWork
copyright: Copyright (c) 2026 jean
asar: true
directories:
  output: release/${version}

# asar 内**只放壳**：主进程 + preload（tsc 产物 out/）。真实 SPA 由 sidecar 从 static/ 提供。
files:
  - out/**

# asar 外资源（落到 process.resourcesPath，供 spawn / 读取）：
# - static：已构建的渲染层 SPA，sidecar 的 GREYWORK_STATIC_DIR 指向它；
# - icons：托盘图标（主进程 tray.ts 读）；
# - server：sidecar 二进制，按平台在各段里加（扩展名不同）。
extraResources:
  - from: ../desktop/dist
    to: static
  - from: resources/icons/32x32.png
    to: icons/32x32.png

mac:
  icon: resources/icons/icon.icns
  target:
    - dmg
  artifactName: ${productName}-Mac-${version}.${ext}
  extraResources:
    - from: ../../target/release/greywork-server
      to: server/greywork-server

win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Windows-${version}-Setup.${ext}
  extraResources:
    - from: ../../target/release/greywork-server.exe
      to: server/greywork-server.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 卸载不删用户数据（会话 / 凭据 / 工作区授权都在 userData 下）。
  deleteAppDataOnUninstall: false

linux:
  icon: resources/icons/icon.png
  category: Development
  target:
    - AppImage
  artifactName: ${productName}-Linux-${version}.${ext}
  extraResources:
    - from: ../../target/release/greywork-server
      to: server/greywork-server
