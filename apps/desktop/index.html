<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreyWork · Desktop</title>
    <!-- 首帧外观 + 启动打点：外链（同源）而非内联，见 public/boot.js 顶部说明。
         经典脚本在解析时同步执行，仍然早于下面那个 deferred 的模块入口。 -->
    <script src="/boot.js"></script>
    <!-- 首帧兜底底色走同源外链，**不要**写回内联 style 标签：桌面壳打包时 Tauri 会给
         style-src 追加 nonce，而带 nonce 会让 `'unsafe-inline'` 失效，连带拦掉 CodeMirror
         等运行时注入的样式（预览面板会塌成「只有行号」）。详见 public/boot.css 顶部说明。 -->
    <link rel="stylesheet" href="/boot.css" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
