<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreyWork · Desktop</title>
    <!-- 首帧外观 + 启动打点：外链（同源）而非内联，见 public/boot.js 顶部说明。
         经典脚本在解析时同步执行，仍然早于下面那个 deferred 的模块入口。 -->
    <script src="/boot.js"></script>
    <style>
      /* CSS 加载前的兜底底色，随上面脚本解析出的 data-theme 分支（令牌此时还没到）。
         值与 tokens.css 的 --ink 对齐：灰了会在纯黑上闪一下浅边。 */
      html {
        background-color: #000000;
      }
      html[data-theme="light"] {
        background-color: #ffffff;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
