[package]
name = "greywork"
version = "0.3.0"
description = "GreyWork desktop shell"
authors = ["GreyWork Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "greywork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 依赖的调试信息是 target/debug 体积与重编时间的大头：本机同一棵依赖树，release（debug=0）
# 的 target 是 3.6GB，dev（默认 debug=2）是 66GB。依赖里的变量几乎不会用调试器去看，
# 但**回溯还需要文件和行号**，所以降到 1（limited，保留行表）而不是 0。
# 自己的 crate 不受影响（这里只匹配依赖），本地开发照旧能单步。
[profile.dev.package."*"]
debug = 1

[dependencies]
# macos-private-api: 悬浮宠物窗用 WebviewWindowBuilder::transparent，该方法在 macOS 上
# 被 #[cfg(any(not(target_os = "macos"), feature = "macos-private-api"))] 门控，
# 不开这个 feature 则 macOS 编译报 E0599。同时需 tauri.conf.json 的 app.macOSPrivateApi: true。
# tray-icon: 系统托盘（TrayIconBuilder / Menu）在这个 feature 之后才存在。
# 不开 image-png：托盘图标直接取 app.default_window_icon()（构建期已解码成 RGBA），
# 只有从字节流 Image::from_bytes 载图标才需要它。
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol = "2.0.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"

# 文本文件读取要按编码解码 —— Windows 记事本默认存 GBK/GB18030（简中「ANSI」）或
# UTF-16，strict UTF-8 读会报错或读出乱码。encoding_rs 负责 BOM 嗅探与解码，
# chardetng 负责无 BOM 时的编码检测（两者均来自 Firefox 的编码栈）。
encoding_rs = "0.8"
chardetng = "1"

sha2 = "0.10"
# 企业微信 / QQ 扫码创建：AstrBot 逆向出的 q.qq.com 绑定流程把 AppSecret 以 AES-256-GCM
# 密文下发（12B nonce + 密文 + 16B tag），绑定用的对称密钥由本机生成并只留在宿主内存。
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
getrandom = "0.3"
form_urlencoded = "1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

# 老格式 .xls（OLE2/BIFF）在渲染端没有可用的解析器：exceljs 只认 xlsx，Univer 也走 exceljs。
# JS 侧唯一能读 xls 的 SheetJS 已从 npm 下架（npm 上停在 0.18.5，带两个未修复 CVE），
# 故改由宿主解析 —— calamine 是纯 Rust，同时覆盖 xls/xlsx/xlsb/ods，且能按内容嗅探
# 而不只看扩展名（.xlt 与「名为 .xls 实为 xlsx」都能正确读）。
# 不开 `chrono` feature：日期展示走 ExcelDateTime::to_ymd_hms_milli（非 feature 门控），
# 少一个 feature 就少一处版本/特性统一面的意外。
calamine = "0.36"

# Unix 上按进程组回收子进程树要 killpg(2)（见 process_guard::kill_process_tree）。
# Windows 走 taskkill，用不到，故限定平台 —— 顺带避免给 Windows 构建引入无用依赖。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
