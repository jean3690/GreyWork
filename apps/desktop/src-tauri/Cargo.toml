[package]
name = "greywork"
version = "0.1.0"
description = "GreyWork desktop shell"
authors = ["GreyWork Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "greywork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: 悬浮宠物窗用 WebviewWindowBuilder::transparent，该方法在 macOS 上
# 被 #[cfg(any(not(target_os = "macos"), feature = "macos-private-api"))] 门控，
# 不开这个 feature 则 macOS 编译报 E0599。同时需 tauri.conf.json 的 app.macOSPrivateApi: true。
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol = "2.0.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"

sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
getrandom = "0.3"
form_urlencoded = "1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
