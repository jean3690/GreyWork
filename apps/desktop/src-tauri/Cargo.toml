[package]
name = "greywork"
version = "0.7.0"
description = "GreyWork desktop shell"
authors = ["GreyWork Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "greywork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 领域逻辑（文件/Git/表格、db、llm、acp_host、channel_media 与各通道…）收在 workspace 的
# `crates/greywork-host`，与 headless 服务端共用同一份实现；本壳只保留 `#[tauri::command]`
# 薄包装与真·宿主专属模块（sys / tray / notify / close_guard / plugin_window / TauriHost）。
# 领域侧依赖（calamine / wechatbot / rusqlite / reqwest / aes-gcm …）随之移入该 crate，
# 这里不再声明 —— 桌面 manifest 只留「宿主壳真的直接用到」的东西。
greywork-host = { path = "../../../crates/greywork-host" }
# macos-private-api: 悬浮宠物窗用 WebviewWindowBuilder::transparent，该方法在 macOS 上
# 被 #[cfg(any(not(target_os = "macos"), feature = "macos-private-api"))] 门控，
# 不开这个 feature 则 macOS 编译报 E0599。同时需 tauri.conf.json 的 app.macOSPrivateApi: true。
# tray-icon: 系统托盘（TrayIconBuilder / Menu）在这个 feature 之后才存在。
# 不开 image-png：托盘图标直接取 app.default_window_icon()（构建期已解码成 RGBA），
# 只有从字节流 Image::from_bytes 载图标才需要它。
# unstable: 内嵌浏览器用主窗口里的 child webview（`Window::add_child` +
# `WebviewBuilder`），这两个 API 在 Tauri 2.x 全挂在 `unstable` feature 后面
# （见 browser.rs 顶部）。与 macos-private-api / tray-icon 无冲突，是相加的。
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 单实例守卫：重复启动（双击图标 / 快捷方式）不再起第二个进程，而是把已有窗口叫回来。
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅剩的用途是原生文件/目录选择器的 oneshot 回调（fs_pick_files / pick_workspace_folder）；
# 命令实现本身已不直接引 tokio（spawn 走 tauri::async_runtime，见 scheduler.rs）。
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "process", "io-util"] }
# 媒体流式协议（media_protocol.rs）用：Range 头解析与路径百分号解码。
# `http-range` 就是 Tauri 自带 asset 协议用的同一个 crate（在 Tauri 里挂在 protocol-asset
# feature 后）；自己手写多段 range / 后缀 range 的边界不值得，直接用它。
http-range = "0.1"
percent-encoding = "2"

[dev-dependencies]
# 集成测试（tests/*.rs）直接驱动 ACP 客户端，故显式依赖。
agent-client-protocol = "2.0.0"

# Linux 上内嵌浏览器（browser_linux.rs）要自己建 wry webview：Tauri 的 `Window::add_child`
# 在这边把子 webview 塞进主窗口默认的 GtkBox（`build_gtk(default_vbox)`），坐标被 GTK 布局
# 吃掉、`set_bounds` 也变成空操作（`is_in_fixed_parent = false`）。只有把 webview 建进
# `gtk::Fixed` 才能按坐标内嵌 —— 这是 wry README 明确推荐的做法。
# 版本与 tauri 内部传递依赖一致（Cargo.lock 已锁 wry 0.57.0 / gtk 0.18.2），不引入新版本。
[target.'cfg(target_os = "linux")'.dependencies]
wry = "0.57"
gtk = "0.19"
