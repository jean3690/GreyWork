[package]
name = "greywork"
version = "0.3.0"
description = "GreyWork desktop shell"
authors = ["GreyWork Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "greywork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 领域逻辑（文件/Git/表格、db、llm、acp_host、channel_media 与各通道…）收在 workspace 的
# `crates/greywork-host`，与 headless 服务端共用同一份实现；本壳只保留 `#[tauri::command]`
# 薄包装与真·宿主专属模块（sys / tray / notify / close_guard / plugin_window / TauriHost）。
# 领域侧依赖（calamine / wechatbot / rusqlite / reqwest / aes-gcm …）随之移入该 crate，
# 这里不再声明 —— 桌面 manifest 只留「宿主壳真的直接用到」的东西。
greywork-host = { path = "../../../crates/greywork-host" }
# macos-private-api: 悬浮宠物窗用 WebviewWindowBuilder::transparent，该方法在 macOS 上
# 被 #[cfg(any(not(target_os = "macos"), feature = "macos-private-api"))] 门控，
# 不开这个 feature 则 macOS 编译报 E0599。同时需 tauri.conf.json 的 app.macOSPrivateApi: true。
# tray-icon: 系统托盘（TrayIconBuilder / Menu）在这个 feature 之后才存在。
# 不开 image-png：托盘图标直接取 app.default_window_icon()（构建期已解码成 RGBA），
# 只有从字节流 Image::from_bytes 载图标才需要它。
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅剩的用途是原生文件/目录选择器的 oneshot 回调（fs_pick_files / pick_workspace_folder）；
# 命令实现本身已不直接引 tokio（spawn 走 tauri::async_runtime，见 scheduler.rs）。
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "process", "io-util"] }

[dev-dependencies]
# 集成测试（tests/*.rs）直接驱动 ACP 客户端，故显式依赖。
agent-client-protocol = "2.0.0"
