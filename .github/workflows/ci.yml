name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # web 侧的检查拆成 4 个并行 job。实测（master push，run 35235248057）串行时这 5 步分别是
  # ESLint 0.9 / Prettier 0.2 / typecheck 0.6 / 测试 1.4 / 构建 0.8 min，加起来 3.9 min 墙钟；
  # 拆开后墙钟≈最慢的一步（测试 1.4 min），代价是每个 job 各付一次 install（缓存命中约 0.2 min）。
  # 公开仓库的 Actions 分钟数不计费，多花的机器时间不产生成本。
  lint:
    name: Lint (eslint · prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: Typecheck (vue-tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Typecheck (packages + apps)
        run: pnpm typecheck

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Tests
        run: pnpm -r test

  renderer:
    name: Build (renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      # 跑的就是 desktop 的 build 脚本（vue-tsc + vite），不拆脚本：保证 CI 构建的产物
      # 与本地、与 tauri 打包时用的是同一条路径。类型检查在 typecheck job 已独立覆盖。
      - name: Build (web + desktop renderer)
        run: pnpm build

  desktop:
    name: Tauri Bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: deb
            bundle: deb
          - os: windows-latest
            platform: nsis
            bundle: nsis
          - os: macos-latest
            platform: dmg
            bundle: dmg
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          # 与 release.yml 的打包 job 同一个缓存键：见 composite 里的说明。
          shared-key: tauri
      - uses: ./.github/actions/setup-node

      # tauri build 会先跑 beforeBuildCommand（pnpm build 编 renderer），
      # 再编译 Rust 并打整包 —— 这是 web/rust 两个 job 都覆盖不到的「整包能否出来」。
      # 每平台只打一个 bundle，验证该平台 SDK/链接/打包管线齐全：
      # Linux 走 deb（AppImage 需现场下载 linuxdeploy，CI 不稳定），Windows 走 nsis，macOS 走 dmg。
      # CI 只验「整包能否出来」，不签更新产物：createUpdaterArtifacts 开着会要求
      # TAURI_SIGNING_PRIVATE_KEY，而冒烟矩阵没有（也不该依赖 release 机密——fork PR 读不到）。
      # 用 -c 内联覆盖关掉更新产物，签名与 latest.json 只在 release.yml 里做。
      - name: Build (tauri bundle)
        run: pnpm --filter @greywork/desktop tauri build --bundles ${{ matrix.bundle }} -c '{"bundle":{"createUpdaterArtifacts":false}}'

  rust:
    name: Cargo Test (src-tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy,rustfmt

      # fmt / clippy / test 共用一个 job 和一个 target 目录：三者编译的产物互相复用，
      # 拆开反而各自从缓存恢复一遍、各自重编一遍本地 crate。
      - name: Rustfmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      # --locked：Cargo.lock 与 Cargo.toml 不一致时立刻失败，而不是在 CI 里静默改锁文件。
      # --all-targets：不加就只检查 lib/bin，tests/ 与 examples/ 里的代码不受 lint
      # 覆盖（本仓 tests/ 下有 7 个集成测试文件）。实测本地全量通过，加上不产生新告警。
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  # Windows 专属代码在 ubuntu 的 rust job 里根本编不到（taskkill 的创建标志、cmd /C
  # 垫片、盘符相对路径与保留设备名、逐字前缀）。cargo test 会把 cfg(windows) 的分支
  # 全编一遍，也能真正跑起 #[cfg(windows)] 的用例，所以这一个 job 同时覆盖编译与行为。
  windows:
    name: Windows (cargo test · vitest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # 不传 shared-key：desktop job 的 windows 行打的是 release 包，这里是 debug 的
      # 测试构建，两者共用同一个键只会互相覆盖对方的 profile 产物。用 job 名做默认键，
      # 各自稳定。缓存额度已接近仓库上限，这一点在 setup-rust 里有说明。
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-node

      # 与 rust job 相同的 --locked：Cargo.lock 与 Cargo.toml 不一致时立刻失败。
      # tests/ 下 7 个集成测试里有 4 个会真的拉起 mock agent（node 脚本），
      # 走的就是「宿主拼命令行 → 交 shell 执行」这条路径，Windows 上最容易踩坑。
      - name: Cargo Test (src-tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      # 前端跑与 ubuntu 的 test job 同一套（core 的盘符路径工具、workbench 的标题栏
      # 适配都在里面）。在此之前没有任何 JS 测试跑在 Windows 上。
      - name: Tests (vitest)
        run: pnpm -r test

  # macOS 的 cfg 分支（APFS 大小写折叠、路径比较）在 ubuntu 的 rust job 里编不到，
  # desktop 矩阵的 macOS 行只走 tauri build —— 只产包、不跑测试，于是那些用例从未执行过。
  # 与 windows job 对称：一次 cargo test 同时覆盖 macOS 专属代码的编译与行为。
  macos:
    name: macOS (cargo test · vitest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # 不传 shared-key：desktop job 的 macOS 行打的是 release + universal-apple-darwin，
      # 这里是 debug 的测试构建，共用键只会互相覆盖对方的 profile 产物（理由同 windows job）。
      - uses: ./.github/actions/setup-rust
        with:
          # setup-rust 装的是 minimal profile，clippy 不会自带 —— 与 ubuntu 的 rust job 同理。
          # 顺带补上：ubuntu 看不到 cfg(target_os = "macos")，macOS 专属的未使用 import /
          # 死代码此前无人管。
          components: clippy
      - uses: ./.github/actions/setup-node

      - name: Clippy (src-tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # 与 rust job 相同的 --locked：Cargo.lock 与 Cargo.toml 不一致时立刻失败。
      - name: Cargo Test (src-tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      # 前端也跑一遍：macOS 上走的是与 ubuntu 相同的 vite/vitest，但涉及平台分支的
      # 渲染端用例（core 的路径工具按平台分叉）值得在第三个平台上确认一次。
      - name: Tests (vitest)
        run: pnpm -r test
