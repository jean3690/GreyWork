name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # web 侧的检查拆成 4 个并行 job。实测（master push，run 35235248057）串行时这 5 步分别是
  # ESLint 0.9 / Prettier 0.2 / typecheck 0.6 / 测试 1.4 / 构建 0.8 min，加起来 3.9 min 墙钟；
  # 拆开后墙钟≈最慢的一步（测试 1.4 min），代价是每个 job 各付一次 install（缓存命中约 0.2 min）。
  # 公开仓库的 Actions 分钟数不计费，多花的机器时间不产生成本。
  lint:
    name: Lint (eslint · prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: Typecheck (vue-tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Typecheck (packages + apps)
        run: pnpm typecheck

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Tests
        run: pnpm -r test

  renderer:
    name: Build (renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      # `pnpm build` 串起两个前端（desktop 与 web），保证两个 FrontSpec 的产物都能出来。
      # 不拆脚本：CI 构建的产物与本地、与 Electron 打包时用的是同一条路径。
      # 类型检查在 typecheck job 已独立覆盖。
      - name: Build (web + desktop renderer)
        run: pnpm build

      # 产物级守卫：web 里不能出现它没启用的特性 chunk（多前端剪枝真的生效）。
      - name: Front bundle guard
        run: node scripts/front-bundle-guard.mjs

  renderer-e2e:
    name: Renderer smoke (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      # 两条 e2e 都是「起 vite dev server → headless Chromium」，不需要 Rust / Electron。
      # 只装 headless shell（约 114MB，比完整 chromium 小一半）；web 与 desktop 共用同一份缓存。
      - name: Install Chromium (headless shell)
        run: pnpm --filter @greywork/web exec playwright-core install chromium-headless-shell

      - name: Web front (WEB_FRONT + preview chain)
        run: pnpm --filter @greywork/web e2e

      - name: Desktop renderer (preview chain)
        run: pnpm --filter @greywork/desktop e2e

  # Electron 的「整包能否出来」是唯一的桌面打包门禁：需要显式编三样东西（Node 宿主 /
  # 渲染层 SPA / 壳的 out）—— 由 `electron:prep` 串起来。
  electron:
    name: Electron Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      # 内置运行时（git / opencode / rg / fd / jq）按 runtime-versions.json 的哈希做缓存：
      # 未变版本时 electron:prep 的 runtime:fetch 直接命中缓存，省去每平台 ~150MB 的下载。
      - name: Cache bundled runtimes
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/greywork-runtime
          key: greywork-runtime-${{ matrix.os }}-${{ hashFiles('scripts/runtime-versions.json') }}

      - name: Unit tests (electron shell)
        run: pnpm --filter @greywork/electron test

      - name: Prepare artifacts (host + renderer + shell)
        run: pnpm electron:prep

      # 只出未压缩目录（--dir）：三平台的安装器 / 磁盘镜像各有额外工具链要在构建时下载
      # （AppImage 拉 linuxdeploy 之类），CI 里不稳定；真正出安装包在 release.yml。
      - name: Package (unpacked)
        run: pnpm --filter @greywork/electron package:dir
