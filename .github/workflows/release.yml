name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # args 直接写整串而不是拼 bundle/target 两列：macOS 需要 --target，
        # 另两个平台不需要，拆成两列后就得在 args 里写 `${{ ... && ... || '' }}` 那种
        # 三元表达式，可读性反而更差。
        include:
          - os: ubuntu-latest
            platform: deb
            args: --bundles deb
          - os: windows-latest
            platform: nsis
            args: --bundles nsis
          # macos-latest 是 arm64 宿主，只出 arm64 的话 Intel Mac 装不了。
          # universal-apple-darwin 让 tauri 分别编两个 arch 再 lipo 成一个包，
          # 代价是 Rust 编译时间翻倍（两个 target 目录）。
          - os: macos-latest
            platform: dmg
            args: --bundles dmg --target universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # Release 正文的唯一来源是 CHANGELOG.md 里对应版本的条目：改文案改那里，
      # 不要手改 Release。缺条目会在这里直接失败，避免发出没有说明的版本。
      # 放在装依赖之前：缺条目时不该先花几分钟装工具链再报错。
      - name: 从 CHANGELOG 抽取发布说明
        id: notes
        run: node scripts/changelog-section.mjs "${{ github.ref_name }}" --github-output body

      - uses: ./.github/actions/setup-rust
        with:
          # 与 ci.yml 的 desktop job 同一个缓存键，tag run 因此能命中 master 上的依赖缓存。
          shared-key: tauri
          # 只有 macOS 那行给了值；空串时不追加任何 --target 标志（dtolnay 的
          # action 是按输入拼 rustup 参数，不是条件执行）。
          targets: ${{ matrix.rustTargets }}
      - uses: ./.github/actions/setup-node

      # tauri-action 内部执行 tauri build：
      # beforeBuildCommand（pnpm build，编 renderer）→ Rust 编译 → 打 bundle 并上传到 Release。
      # 与 ci.yml 的 desktop job 保持同一平台/包矩阵（Linux 只打 deb，避开 AppImage 的 linuxdeploy 下载不稳定）。
      - name: Build and upload to GitHub Release
        id: tauri
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "GreyWork ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
