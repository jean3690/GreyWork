name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先把 draft Release 建出来（正文来自 CHANGELOG），三平台的 Electron 安装包才有地方传。
  # Release 正文的唯一来源是 CHANGELOG.md 里对应版本的条目：改文案改那里，不要手改 Release。
  # 缺条目会在这里直接失败，避免发出没有说明的版本。
  release-notes:
    name: Draft release (notes from CHANGELOG)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 从 CHANGELOG 抽取发布说明
        run: node scripts/changelog-section.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "GreyWork ${{ github.ref_name }}" \
            --notes-file release-notes.md

  # 三平台 Electron 安装包，附到上面的 draft Release。
  # 用 gh 上传而不是 electron-builder 的 publisher：后者会自行创建/改写 Release，
  # 会和上一步抢同一份正文。
  release-electron:
    name: Release Electron (${{ matrix.os }})
    needs: release-notes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust
      - uses: ./.github/actions/setup-node

      - name: Prepare artifacts (server + renderer + shell)
        run: pnpm electron:prep

      # --publish never：只出产物，发布交给取消 draft（人工确认三平台都绿之后）。
      - name: Package installers
        run: pnpm --filter @greywork/electron package -- --publish never

      # 只传安装包本体：输出目录里还有 *-unpacked/ 与 builder-debug.yml，gh 不接受目录。
      # nullglob 让「本平台没产的扩展名」塌成空数组，而不是把字面量当文件名传给 gh。
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(apps/electron/release/*/*.AppImage apps/electron/release/*/*-Setup.exe apps/electron/release/*/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没找到任何安装包产物，打包步骤可能没产出或命名变了"
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
