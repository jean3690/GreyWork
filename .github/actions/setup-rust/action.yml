name: Setup Rust + Tauri deps
description: 安装 Tauri 系统依赖、Rust 工具链并恢复 Rust 构建缓存

inputs:
  components:
    description: 额外 rustup 组件（逗号分隔），如 clippy,rustfmt
    required: false
    default: ""
  shared-key:
    description: 覆盖缓存键里的 job 名，让不同 workflow / job 共用同一份依赖产物（留空 = 按 job 名隔离）
    required: false
    default: ""

runs:
  using: composite
  steps:
    # patchelf 只服务 AppImage，而 CI 只打 deb（见 ci.yml 的说明），所以不装。
    - name: Install Tauri system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    # 缓存策略集中在这里。rust-cache 只缓存依赖产物，自身 crate 不进缓存 ——
    # 所以「依赖缓存命中」决定了这个 job 是 2 分钟还是 10 分钟。
    #
    # shared-key：缓存键默认含 job 名，于是 ci.yml 的 desktop job（v0-rust-desktop-*）
    # 和 release.yml 的 release job（v0-rust-release-*）各存一份、互不可见。实测 tag 发布时
    # release 的 build 步是冷的：7.2 / 8.9 / 11.2 min，而 CI 的 desktop job 打同一个包只要
    # 2.5 / 4.0 / 4.4 min。统一成 tauri 后，tag run 在自己作用域里找不到键，就按 GitHub 的
    # 作用域规则去默认分支找 —— 直接复用 master 上那份。三个平台不会串味：键里还有 OS/arch
    # 和 rustc hash。
    #
    # save-if：只在 master / tag 上写缓存。GitHub 的缓存额度是整个仓库 10GB，实测本仓已顶到
    # 10186MB，其中 7 份是 refs/pull/*/merge 作用域下的 ~595MB 桌面缓存：每个 PR 存一份，
    # 只有该 PR 后续的 run 用得上，却会把 master 的缓存挤出去 —— 一旦被挤掉，下次就是重编
    # 整棵依赖树。PR 的依赖与 master 基本一致，本来也不需要另存。
    #
    # cache-on-failure：编译失败也把依赖产物留下，重跑时不必从零编依赖。
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri
        shared-key: ${{ inputs.shared-key }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
